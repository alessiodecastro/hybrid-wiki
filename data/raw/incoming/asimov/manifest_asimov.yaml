# Manifest del corpus Asimov — Ciclo della Fondazione.
# Secondo dominio per i test cross-domain.
#
# Lanciare con:
#   python scripts/ingest_folder.py --manifest data/raw/incoming/asimov/manifest_asimov.yaml
#
# I path di `file` sono relativi a questa directory (base_dir default = dir del manifest).
#
# NOTE PER IL TEST DI SCALING:
# - psicostoria.txt e fondazione.txt sono volutamente SENZA subtype: sono
#   "concetti/organizzazioni" che NON rientrano in VALID_SUBTYPES
#   (character|place|artifact|event|book). Stress voluto sulla tassonomia:
#   osservare come l'estrattore entità classifica (o forza) questi casi.
# - Contraddizione voluta intra-Asimov: la popolazione di Trantor è
#   "circa 40 miliardi" in trantor.txt e "circa 45 miliardi" in
#   impero_galattico.txt. Verifica la conflict resolution sul 2° dominio.

defaults:
  domain: asimov
  level: L1

documents:
  - { file: hari_seldon.txt,           title: "Hari Seldon",            level: L2, subtype: character }
  - { file: il_mulo.txt,               title: "Il Mulo",                level: L2, subtype: character }
  - { file: trantor.txt,               title: "Trantor",                level: L2, subtype: place }
  - { file: terminus.txt,              title: "Terminus",               level: L2, subtype: place }
  - { file: crisi_seldon.txt,          title: "Le Crisi Seldon",        level: L2, subtype: event }
  - { file: enciclopedia_galattica.txt, title: "Enciclopedia Galattica", level: L2, subtype: book }
  - { file: psicostoria.txt,           title: "La Psicostoria",         level: L2 }   # concetto: niente subtype
  - { file: fondazione.txt,            title: "La Fondazione",          level: L2 }   # organizzazione: niente subtype
  - { file: impero_galattico.txt,      title: "L'Impero Galattico",     level: L1 }
  - { file: nota_editoriale.txt,       title: "Nota editoriale Terminus", level: L0 }
