# Manifest del corpus seed Tolkien.
# Lanciare con:
#   python scripts/ingest_folder.py --manifest data/raw/incoming/manifest_tolkien.yaml
#
# I path di `file` sono relativi a base_dir (default: la dir di questo manifest).

defaults:
  domain: tolkien
  level: L1

documents:
  - { file: frodo_intro.txt,        title: "Frodo Baggins — introduzione",   level: L2, subtype: character }
  - { file: gandalf_intro.txt,      title: "Gandalf — introduzione",         level: L2, subtype: character }
  - { file: aragorn_intro.txt,      title: "Aragorn — introduzione",         level: L2, subtype: character }
  - { file: sam_intro.txt,          title: "Samwise Gamgee",                 level: L1 }
  - { file: anello_unico.txt,       title: "Anello Unico",                   level: L2, subtype: artifact  }
  - { file: contea.txt,             title: "La Contea",                      level: L2, subtype: place     }
  - { file: mordor.txt,             title: "Mordor",                         level: L2, subtype: place     }
  - { file: monte_fato.txt,         title: "Monte Fato",                     level: L1 }
  - { file: consiglio_elrond.txt,   title: "Consiglio di Elrond",            level: L2, subtype: event     }
  - { file: lettera_routine.txt,    title: "Nota Mathom-house Halimath 1419", level: L0 }
  - { file: sauron_intro.txt,       title: "Sauron",                         level: L2, subtype: character }
